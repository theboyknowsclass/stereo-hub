[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stereo-hub"
version = "0.1.0"
description = "HTTP API and web remote for a Buchardt / Platin WiSA Stereo Hub"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # Alpha and young (first release Sept 2026): pinned exactly, bump deliberately.
    "aiolibresync==0.5.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
stereo-hub = "stereo_hub.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stereo_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
